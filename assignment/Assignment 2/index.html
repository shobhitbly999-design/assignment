<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Hackathon Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 2rem 1rem;
      line-height: 1.5;
    }

    .form-container {
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      padding: 2rem 2.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
      border-top: 5px solid #0f766e;
    }

    .form-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 1rem;
    }

    .form-header h1 {
      font-size: 1.75rem;
      color: #0f172a;
    }

    .form-header p {
      font-size: 0.9rem;
      color: #64748b;
    }

    .required-star {
      color: #dc2626;
      font-weight: bold;
    }

    fieldset {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    legend {
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f766e;
      padding: 0 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #334155;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="url"],
    input[type="number"],
    input[type="date"],
    input[type="time"],
    input[list],
    select,
    textarea {
      width: 100%;
      padding: 0.55rem 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      font-size: 0.92rem;
      color: #0f172a;
      background-color: #f8fafc;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #0f766e;
      background-color: #ffffff;
    }

    input[type="file"] {
      font-size: 0.88rem;
      padding: 0.3rem 0;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #0f766e;
      cursor: pointer;
    }

    input[type="color"] {
      width: 55px;
      height: 32px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .inline-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .group-label {
      font-weight: 600;
      color: #334155;
    }

    .inline-group label {
      margin-right: 0.5rem;
      cursor: pointer;
    }

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: #0f766e;
      cursor: pointer;
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1rem;
    }

    button {
      padding: 0.65rem 1.4rem;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit {
      background-color: #0f766e;
      color: #ffffff;
    }

    .btn-submit:hover {
      background-color: #115e59;
    }

    .btn-reset {
      background-color: #e2e8f0;
      color: #334155;
    }

    .btn-reset:hover {
      background-color: #cbd5e1;
    }
  </style>
</head>
<body>

  <main class="form-container">
    <header class="form-header">
      <h1>Hackathon Registration</h1>
      <p>Annual Student Developer Sprint • <span class="required-star">*</span> Required</p>
    </header>

    <form action="#" method="POST" enctype="multipart/form-data">

      <!-- SECTION 1: Personal Details -->
      <fieldset>
        <legend>Personal Details</legend>

        <div class="form-group">
          <label for="fullname">Full name <span class="required-star">*</span></label>
          <input type="text" id="fullname" name="fullname" placeholder="Rohan Verma" minlength="3" required>
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required-star">*</span></label>
          <input type="email" id="email" name="email" placeholder="rohan@example.com" required>
        </div>

        <div class="form-group">
          <label for="password">Portal password <span class="required-star">*</span></label>
          <input type="password" id="password" name="password" placeholder="Min 8 characters" minlength="8" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone <span class="required-star">*</span></label>
          <input type="tel" id="phone" name="phone" placeholder="9876543210" pattern="[0-9]{10}" title="Enter a 10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="github">GitHub / Portfolio URL</label>
          <input type="url" id="github" name="github" placeholder="https://github.com">
        </div>

        <div class="form-group">
          <label for="age">Age <span class="required-star">*</span></label>
          <input type="number" id="age" name="age" placeholder="19" min="16" max="35" required>
        </div>

        <div class="inline-group">
          <span class="group-label">Gender:</span>
          <input type="radio" id="male" name="gender" value="male">
          <label for="male">Male</label>

          <input type="radio" id="female" name="gender" value="female">
          <label for="female">Female</label>

          <input type="radio" id="other" name="gender" value="other" checked>
          <label for="other">Other / prefer not to say</label>
        </div>
      </fieldset>

      <!-- SECTION 2: Academic & Track Info -->
      <fieldset>
        <legend>Academic & Track Info</legend>

        <div class="form-group">
          <label for="track">Hackathon Track <span class="required-star">*</span></label>
          <select id="track" name="track" required>
            <option value="">-- Select a Track --</option>
            <option value="web" selected>Web & App Development</option>
            <option value="ai">AI & Machine Learning</option>
            <option value="cyber">Cybersecurity & Cloud</option>
            <option value="iot">IoT & Hardware</option>
          </select>
        </div>

        <div class="form-group">
          <label for="city">Preferred Hub City</label>
          <input list="cities" id="city" name="city" placeholder="Start typing (e.g., Bengaluru)">
          <datalist id="cities">
            <option value="Bengaluru">
            <option value="Delhi NCR">
            <option value="Mumbai">
            <option value="Hyderabad">
            <option value="Pune">
          </datalist>
        </div>

        <div class="inline-group">
          <span class="group-label">Tech Stack:</span>
          <input type="checkbox" id="htmlcss" name="skills" value="HTML/CSS" checked>
          <label for="htmlcss">HTML/CSS</label>

          <input type="checkbox" id="js" name="skills" value="JavaScript" checked>
          <label for="js">JavaScript</label>

          <input type="checkbox" id="python" name="skills" value="Python">
          <label for="python">Python</label>
        </div>
      </fieldset>

      <!-- SECTION 3: Schedule & Extras -->
      <fieldset>
        <legend>Schedule & Extras</legend>

        <div class="form-group">
          <label for="arrival-date">Arrival Date <span class="required-star">*</span></label>
          <input type="date" id="arrival-date" name="arrival-date" min="2026-11-15" required>
        </div>

        <div class="form-group">
          <label for="checkin-time">Preferred Check-in Time</label>
          <input type="time" id="checkin-time" name="checkin-time" value="09:30">
        </div>

        <div class="form-group">
          <label for="id-proof">Student ID / Resume (PDF) <span class="required-star">*</span></label>
          <input type="file" id="id-proof" name="id-proof" accept=".pdf,.png,.jpg" required>
        </div>

        <div class="form-group">
          <label for="experience">Coding Experience Level (1 to 10): <span id="exp-val">5</span></label>
          <input type="range" id="experience" name="experience" min="1" max="10" value="5" oninput="document.getElementById('exp-val').textContent = this.value">
        </div>

        <div class="inline-group">
          <label for="badge-color" class="group-label">Team Badge Colour:</label>
          <input type="color" id="badge-color" name="badge-color" value="#0f766e">
        </div>

        <div class="form-group">
          <label for="pitch">What do you plan to build?</label>
          <textarea id="pitch" name="pitch" rows="4" placeholder="Briefly describe your project idea or goals..." minlength="10"></textarea>
        </div>
      </fieldset>

      <!-- Buttons -->
      <div class="button-group">
        <button type="submit" class="btn-submit">Register Now</button>
        <button type="reset" class="btn-reset">Reset</button>
      </div>

    </form>
  </main>

</body>
</html>
